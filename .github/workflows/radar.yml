name: Content Opportunity Radar

# Phase 1 scheduled radar. Collects public manufacturing signals (Reddit public
# JSON + free RSS/Atom), normalizes, filters for real problems, dedupes, and
# commits the daily report back to the repo. No secrets, no LLM, no paid APIs.
on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run radar (live public-data collection)
        run: |
          python -m app.radar.pipeline

      - name: Commit daily report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No new radar output to commit"
          else
            git commit -m "radar: daily content opportunity report $(date -u +%Y-%m-%d)"
            git push
          fi
